events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- 1. ПОРТ 80: ЕДИНЫЙ РЕСПУБЛИКАНСКИЙ ПОРТАЛ ---
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html/portal;
        index index.html;

        # Прямой маршрут в панель NOC Admin
        location = /admin {
            try_files /index.html =404;
        }
        location = /admin/ {
            try_files /index.html =404;
        }


        # Главная страница: отдаем наш красивый портал
                
        

        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API верификации ЭЦП (напрямую в FastAPI-микросервис)
        location /api/verify {
            proxy_pass http://signature-validator:8000/api/v1/verify;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

       # API Stirling-PDF (Ремонт, OCR и Конвертация с таймаутами)
        location /api/stirling/ {
            proxy_pass http://stirling-pdf:8080/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ВОТ В ЭТУ СТРОЧКУ ВСТАВЛЯЙ ТВОЙ КЛЮЧ В КАВЫЧКАХ:
            proxy_set_header X-API-KEY "sk_7389c62eefa9dbe7c231b1a6515dae5e79cb9dff";
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # n8n вебхуки и оркестрация
        # API авторизации пользователей (FastAPI)
        location /api/auth/ {
            proxy_pass http://signature-validator:8000/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # API личного кабинета и облачного архива S3
                location /api/admin/ {
            proxy_pass http://signature-validator:8000/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/user/ {
            proxy_pass http://signature-validator:8000/api/user/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /n8n/ {
            proxy_pass http://n8n:5678/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- 2. ПОРТ 8080: ПРЯМАЯ КОНСОЛЬ STIRLING-PDF ---
    server {
        listen 8080;
        server_name _;
                
        

        location / {
            proxy_pass http://stirling-pdf:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- 3. ПОРТ 8000: SWAGGER UI ВАЛИДАТОРА ЭЦП ---
    server {
        listen 8000;
        server_name _;
                
        

        location / {
            proxy_pass http://signature-validator:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
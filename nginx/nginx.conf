events {
    worker_connections 1024;
}

http {
    # Разрешаем загрузку больших файлов (до 100 МБ) для PDF-конвертера
    client_max_body_size 100M;

    # Поддержка WebSockets (критично для n8n!)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- 1. СЕРВЕР N8N (Основной корень: http://<IP_сервера>/) ---
    server {
        listen 80;
        server_name _;

        # Проксируем все запросы в контейнер n8n по его внутреннему имени в Docker
        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;

            # Заголовки для WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Передаем реальные IP-адреса клиентов
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Проксируем Stirling-PDF по пути /pdf/
        location /pdf/ {
            proxy_pass http://stirling-pdf:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
events {
    worker_connections 1024;
}

http {
    # Разрешаем загрузку очень больших архивов документов (до 1000 МБ)
    client_max_body_size 1000M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 1. Порт 80: n8n
    server {
        listen 80;
        server_name _;
        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2. Порт 8080: Stirling-PDF
    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://stirling-pdf:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. Порт 8000: Проверка ЭЦП
    server {
        listen 8000;
        server_name _;
        location / {
            proxy_pass http://signature-validator:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 4. Порт 9001: MinIO S3 Web Console
    server {
        listen 9001;
        server_name _;
        location / {
            proxy_pass http://minio:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
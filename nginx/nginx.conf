events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- 1. ПОРТ 80: ЕДИНЫЙ РЕСПУБЛИКАНСКИЙ ПОРТАЛ ---
    server {
        listen 80;
        server_name _;

        # Главная страница: отдаем наш красивый портал
        location / {
            root /usr/share/nginx/html/portal;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API верификации ЭЦП (напрямую в наш микросервис)
        location /api/verify {
            proxy_pass http://signature-validator:8000/api/v1/verify;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # n8n переносим на путь /n8n/
        location /n8n/ {
            proxy_pass http://n8n:5678/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- 2. ПОРТ 8080: STIRLING-PDF ---
    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://stirling-pdf:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- 3. ПОРТ 8000: SWAGGER UI ВАЛИДАТОРА ---
    server {
        listen 8000;
        server_name _;
        location / {
            proxy_pass http://signature-validator:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
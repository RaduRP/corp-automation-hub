networks:
  hub-net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  stirling_data:
  minio_data:
  prometheus_data:
  grafana_data:

services:

  # --- REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: lab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./portal:/usr/share/nginx/html/portal:ro
    networks:
      - hub-net
    depends_on:
      - n8n
      - stirling-pdf
      - signature-validator
      - minio

  # --- КОРПОРАТИВНОЕ S3 ХРАНИЛИЩЕ MINIO ---
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - hub-net

  # --- МИКРОСЕРВИС ПРОВЕРКИ ЭЦП ---
  signature-validator:
    build:
      context: ./services/signature-validator
      dockerfile: Dockerfile
    image: lab-signature-validator:latest
    container_name: lab-signature-validator
    restart: unless-stopped
    networks:
      - hub-net

  # --- БАЗА ДАННЫХ ДЛЯ N8N ---
  postgres-db:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- N8N ---
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lab-n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - hub-net
    depends_on:
      postgres-db:
        condition: service_healthy

  # --- STIRLING-PDF ---
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: lab-stirling-pdf
    restart: unless-stopped
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=true
      - LANGS=ru_RU,en_US
    volumes:
      - stirling_data:/usr/share/tessdata
    networks:
      - hub-net

  # --- CADVISOR (СБОРЩИК МЕТРИК КОНТЕЙНЕРОВ) ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lab-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - hub-net

  # --- PROMETHEUS (ХРАНИЛИЩЕ МЕТРИК) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: lab-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - hub-net
    depends_on:
      - cadvisor

  # --- GRAFANA (ДАШБОРДЫ И ВИЗУАЛИЗАЦИЯ) ---
  grafana:
    image: grafana/grafana:latest
    container_name: lab-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - hub-net
    depends_on:
      - prometheus

networks:
  hub-net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  stirling_data:

services:

  # --- REVERSE PROXY (ЕДИНАЯ ТОЧКА ВХОДА) ---
  nginx:
    image: nginx:alpine
    container_name: lab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hub-net
    depends_on:
      - n8n
      - stirling-pdf

  # --- БАЗА ДАННЫХ ДЛЯ N8N ---
  postgres-db:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- N8N (АВТОМАТИЗАЦИЯ) ---
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lab-n8n
    restart: unless-stopped
    # Порты убрали! Доступ только через Nginx
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - hub-net
    depends_on:
      postgres-db:
        condition: service_healthy

  # --- STIRLING-PDF (ДОКУМЕНТЫ) ---
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: lab-stirling-pdf
    restart: unless-stopped
    # Порты убрали! Доступ только через Nginx
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=true
      - LANGS=ru_RU,en_US
    volumes:
      - stirling_data:/usr/share/tessdata
    networks:
      - hub-net
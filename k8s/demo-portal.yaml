apiVersion: apps/v1
kind: Deployment
metadata:
  name: docgov-k8s-demo
  labels:
    app: docgov-demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: docgov-demo
  template:
    metadata:
      labels:
        app: docgov-demo
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: docgov-k8s-service
spec:
  type: NodePort
  selector:
    app: docgov-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090

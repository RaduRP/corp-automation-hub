apiVersion: apps/v1
kind: Deployment
metadata:
  name: docgov-pdf-engine
  labels:
    app: docgov-pdf-engine
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docgov-pdf-engine
  template:
    metadata:
      labels:
        app: docgov-pdf-engine
    spec:
      containers:
      - name: pdf-engine
        image: stirlingtools/stirling-pdf:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: SECURITY_ENABLE_LOGIN
          value: "false"
        - name: SYSTEM_DEFAULT_LOCALE
          value: "ru_RU"
---
apiVersion: v1
kind: Service
metadata:
  name: docgov-pdf-engine-service
spec:
  selector:
    app: docgov-pdf-engine
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP

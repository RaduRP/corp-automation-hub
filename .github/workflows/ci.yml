name: 🚀 DocGov CI Pipeline
# Срабатывает при любом push или pull request в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test-and-build:
    name: 🧪 Синтаксис, Линтинг и Тестовая сборка Docker
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Скачиваем репозиторий
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
      # Шаг 2: Устанавливаем Python
      - name: 🐍 Настройка окружения Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Шаг 3: Проверка синтаксиса Python без запуска
      - name: 🔍 Проверка синтаксиса Python (Syntax Check)
        run: |
          python -m py_compile services/signature-validator/app/main.py
          python -m py_compile services/telegram-bot/bot.py
          echo "✅ Синтаксис Python-скриптов идеален!"
      # Шаг 4: Проверка валидности docker-compose.yaml
      - name: 🐳 Валидация структуры Docker Compose
        run: |
          docker compose config --quiet
          echo "✅ Файл docker-compose.yaml синтаксически корректен!"
      # Шаг 5: Тестовая сборка контейнеров (проверка Dockerfile)
      - name: 🔨 Тестовая сборка Docker-образов
        run: |
          echo "Сборка Signature Validator..."
          docker build -t test-signature-validator services/signature-validator/
          echo "Сборка Telegram Bot..."
          docker build -t test-telegram-bot services/telegram-bot/
          echo "🎉 Все образы собираются без ошибок!"

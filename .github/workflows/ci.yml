name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # --- 1. ЭТАП CI: ВАЛИДАЦИЯ СИНТАКСИСА (в облаке GitHub) ---
  lint-and-validate:
    name: Lint & Validate Compose
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Подставляем тестовый .env
        run: cp .env.example .env

      - name: Проверяем валидность docker-compose
        run: |
          docker compose config --quiet
          echo "Синтаксис корректен!"

  # --- 2. ЭТАП CI: СКАНИРОВАНИЕ БЕЗОПАСНОСТИ (в облаке GitHub) ---
  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Сканируем образы на CVE-уязвимости
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'postgres:16-alpine'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # --- 3. ЭТАП CD: АВТОДЕПЛОЙ (НА ТВОЕЙ ВИРТУАЛКЕ ЧЕРЕЗ РАННЕР) ---
  deploy:
    name: CD Deploy to Production VM
    runs-on: self-hosted
    needs: security-scan
    steps:
      - name: Переходим в рабочую папку и обновляем контейнеры
        run: |
          echo "=== НАЧИНАЕМ АВТОМАТИЧЕСКИЙ ДЕПЛОЙ ==="
          cd /home/administrator/devops-lab/automation-hub
          git pull origin main
          docker compose up -d --remove-orphans
          echo "=== ДЕПЛОЙ УСПЕШНО ЗАВЕРШЕН ==="
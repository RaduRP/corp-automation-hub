name: 🚀 DocGov CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  # ==========================================
  # ЭТАП 1: CI (Тесты и сборка в облаке GitHub)
  # ==========================================
  test-and-build:
    name: 🧪 1. Тесты и валидация
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
      - name: 🐍 Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 🔍 Проверка синтаксиса Python
        run: |
          python -m py_compile services/signature-validator/app/main.py
          python -m py_compile services/telegram-bot/bot.py
          echo "✅ Синтаксис Python идеален!"
      - name: 🐳 Валидация Docker Compose
        run: |
          docker compose config --quiet
          echo "✅ Конфигурация Docker Compose корректна!"
      - name: 🔨 Тестовая сборка микросервисов
        run: |
          docker build -t test-signature-validator services/signature-validator/
          docker build -t test-telegram-bot services/telegram-bot/
          echo "🎉 Все микросервисы успешно собраны!"
  # ==========================================
  # ЭТАП 2: CD (Автодеплой на наш сервер dev901)
  # ==========================================
  deploy:
    name: 🚀 2. Автодеплой на Production (dev901)
    needs: test-and-build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📂 Переход в рабочую директорию и Git Pull
        run: |
          cd /home/administrator/devops-lab/automation-hub
          git fetch origin main
          git reset --hard origin/main
          echo "✅ Код на сервере успешно синхронизирован с Git!"
      - name: 🔄 Применение изменений и перезапуск контейнеров
        run: |
          cd /home/administrator/devops-lab/automation-hub
          docker compose up -d --build signature-validator telegram-bot
          echo "🎉 Контейнеры успешно обновлены на сервере dev901!"

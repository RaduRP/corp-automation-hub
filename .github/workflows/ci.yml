name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # --- 1. ВАЛИДАЦИЯ СИНТАКСИСА ---
  lint-and-validate:
    name: Lint & Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Подставляем тестовый .env
        run: cp .env.example .env

      - name: Проверяем валидность docker-compose
        run: |
          docker compose config --quiet
          echo "Синтаксис корректен!"

  # --- 2. СКАНИРОВАНИЕ БЕЗОПАСНОСТИ (С ТАЙМАУТОМ И ЗАЩИТОЙ) ---
  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint-and-validate
    timeout-minutes: 5
    continue-on-error: true   # Если база уязвимостей недоступна, не блокируем релиз
    steps:
      - name: Сканируем образ Postgres
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'postgres:16-alpine'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL'

  # --- 3. АВТОДЕПЛОЙ НА НАШУ ВИРТУАЛКУ ---
  deploy:
    name: CD Deploy to Production VM
    runs-on: self-hosted
    needs: [lint-and-validate, security-scan]
    timeout-minutes: 5
    steps:
      - name: Переходим в рабочую папку и обновляем контейнеры
        run: |
          echo "=== НАЧИНАЕМ АВТОМАТИЧЕСКИЙ ДЕПЛОЙ ==="
          cd /home/administrator/devops-lab/automation-hub
          git pull origin main
          docker compose up -d --remove-orphans
          echo "=== ДЕПЛОЙ УСПЕШНО ЗАВЕРШЕН ==="